name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: arzoom
          POSTGRES_USER: arzoom
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arzoom" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - name: API smoke test
        env:
          DATABASE_URL: postgres://arzoom:test@localhost:5432/arzoom
          ADMIN_TOKEN: ci-admin-token-0123456789
          PORT: 3000
        run: |
          node server.js & sleep 4
          bash scripts/smoke.sh
      - run: docker build -t arzoom-lizinq .
      - name: Korporativ sayt konteyneri
        run: |
          docker build -t arzoom-website ./site
          docker run -d --name website -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL arzoom-website
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ | grep -q "Arzoom Avto" && exit 0; sleep 1; done
          docker logs website; exit 1
      - name: Compose və Caddy konfiqurasiyası
        run: |
          POSTGRES_PASSWORD=x ADMIN_TOKEN=x SITE_ADDRESS=example.com docker compose config -q && mkdir -p backups
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_ADDRESS=example.com -e WEBSITE_ADDRESS="example.org www.example.org" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    environment: production
    env:
      HAS_SSH: ${{ secrets.SSH_HOST != '' && (secrets.SSH_KEY != '' || secrets.SSH_PASSWORD != '') }}
    steps:
      - name: Secrets yoxlanılır
        if: env.HAS_SSH != 'true'
        run: echo "::warning::SSH_HOST və SSH_KEY (və ya SSH_PASSWORD) secrets əlavə olunmayıb, yerləşdirmə ötürüldü. README-yə bax."
      - uses: actions/checkout@v5
        if: env.HAS_SSH == 'true'
      - name: Qovluğu hazırla
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            S=""; [ "$(id -u)" = 0 ] || S=sudo
            $S mkdir -p /opt/arzoom && $S chown "$(id -un)" /opt/arzoom
      - name: Kodu serverə köçür
        if: env.HAS_SSH == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "server.js,reset-password.js,package.json,package-lock.json,Dockerfile,docker-compose.yml,Caddyfile,.dockerignore,lib,db,public,deploy,site"
          target: /opt/arzoom
      - name: Konteynerləri yenilə
        if: env.HAS_SSH == 'true'
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOMAIN: ${{ secrets.DOMAIN || secrets.SSH_HOST }}
          WEBSITE_DOMAIN: ${{ secrets.WEBSITE_DOMAIN }}
          NEW_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEW_ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        with:
          envs: DOMAIN,WEBSITE_DOMAIN,NEW_POSTGRES_PASSWORD,NEW_ADMIN_TOKEN
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            S=""; [ "$(id -u)" = 0 ] || S=sudo
            $S test -f /opt/arzoom/.env || $S bash /opt/arzoom/deploy/bootstrap.sh
            $S env DOMAIN="$DOMAIN" WEBSITE_DOMAIN="$WEBSITE_DOMAIN" NEW_POSTGRES_PASSWORD="$NEW_POSTGRES_PASSWORD" NEW_ADMIN_TOKEN="$NEW_ADMIN_TOKEN" bash /opt/arzoom/deploy/deploy.sh
