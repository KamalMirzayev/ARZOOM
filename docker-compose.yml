services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arzoom
      POSTGRES_USER: arzoom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylında yazılmalıdır}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL is reachable only from the app container, never from the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzoom -d arzoom"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://arzoom:${POSTGRES_PASSWORD}@db:5432/arzoom
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN .env faylında yazılmalıdır}
      DEMO_SMS: ${DEMO_SMS:-true}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
