x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arzoom
      POSTGRES_USER: arzoom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylında yazılmalıdır}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # PostgreSQL is reachable only from the internal network, never from the internet.
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arzoom -d arzoom"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Password goes separately so characters like @ or ! need no URL encoding.
      DATABASE_URL: postgres://arzoom@db:5432/arzoom
      PGPASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN .env faylında yazılmalıdır}
      DEMO_SMS: ${DEMO_SMS:-true}
      DEMO_OTP: ${DEMO_OTP:-123456}
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SOFTLINE_USER: ${SOFTLINE_USER:-}
      SOFTLINE_KEY: ${SOFTLINE_KEY:-}
      SOFTLINE_SENDER: ${SOFTLINE_SENDER:-Arzoomavto}
      SMS_URL: ${SMS_URL:-}
      SMS_METHOD: ${SMS_METHOD:-GET}
      SMS_BODY: ${SMS_BODY:-}
      SMS_HEADERS: ${SMS_HEADERS:-}
      AKB_API_KEY: ${AKB_API_KEY:-}
      OTP_SECRET: ${OTP_SECRET:-}
      STAFF_IDLE_MINUTES: ${STAFF_IDLE_MINUTES:-120}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    networks: [internal, web]
    expose: ["3000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # arzoomavto.az korporativ saytı: statik səhifə, ayrıca konteyner (site/).
  website:
    build: ./site
    restart: unless-stopped
    networks: [web]
    expose: ["8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app, website]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      WEBSITE_ADDRESS: ${WEBSITE_ADDRESS:-website.localhost}
      ADMIN_ALLOW: ${ADMIN_ALLOW:-0.0.0.0/0 ::/0}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      # Korporativ sayt domensiz, IP ilə: https://SERVER_IP:8443
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  # Gündəlik PostgreSQL ehtiyat nüsxəsi: /opt/arzoom/backups, son 14 gün saxlanılır.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: arzoom
      PGDATABASE: arzoom
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/arzoom-$$(date +%Y%m%d-%H%M).sql.gz
          pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "Ehtiyat nüsxə: $$f"
          find /backups -name 'arzoom-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    logging: *logging

networks:
  internal:
    internal: true
  web:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
