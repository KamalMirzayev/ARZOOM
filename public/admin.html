<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Arzoom Qiymətləndirmə</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Staff desk: the customer page's tokens, denser layout. List on the left, one application on the right. */
:root{
  --bg:#080B16; --surface:#0F1426; --raised:#151B32; --ink:#ECEFF8; --muted:#8C95B4; --line:#1F2742; --line-2:#2D3758;
  --blue:#5273FF; --blue-soft:rgb(82 115 255 / .14); --red:#E8323C; --red-soft:rgb(215 31 41 / .16);
  --ok:#6FCF97; --ok-soft:rgb(111 207 151 / .13); --warn:#E9BE62; --warn-soft:rgb(233 190 98 / .13); --bad:#F08A80; --bad-soft:rgb(240 138 128 / .13);
  --f-display:"Archivo","Manrope",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F3F5FB; --surface:#FFFFFF; --raised:#F7F8FD; --ink:#0E1430; --muted:#5A6386; --line:#E2E6F2; --line-2:#CBD2E6;
  --blue:#3F5FF2; --blue-soft:rgb(82 115 255 / .09); --red:#D71F29; --red-soft:rgb(215 31 41 / .08);
  --ok:#1C7A46; --ok-soft:#E1F3E8; --warn:#9A6400; --warn-soft:#FBF0D6; --bad:#B23A30; --bad-soft:#F9E1DE; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F3F5FB; --surface:#FFFFFF; --raised:#F7F8FD; --ink:#0E1430; --muted:#5A6386; --line:#E2E6F2; --line-2:#CBD2E6;
  --blue:#3F5FF2; --blue-soft:rgb(82 115 255 / .09); --red:#D71F29; --red-soft:rgb(215 31 41 / .08);
  --ok:#1C7A46; --ok-soft:#E1F3E8; --warn:#9A6400; --warn-soft:#FBF0D6; --bad:#B23A30; --bad-soft:#F9E1DE; color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);font-stretch:115%;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-display);font-stretch:125%;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--raised);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{resize:vertical;min-height:64px}
label.f{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
label.chk{display:flex;gap:9px;align-items:center;font-weight:600;cursor:pointer}
label.chk input{width:17px;height:17px;accent-color:var(--blue);flex:none}
.btn{white-space:nowrap;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#FFFFFF}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.logoplate{background:#FFFFFF;border-radius:9px;padding:7px 11px;display:inline-flex;box-shadow:0 0 0 1px var(--line)}
.logoplate img{height:19px;display:block}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:14px}
.err{color:var(--bad);font-size:13px;min-height:1em}

/* shell */
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header .t{font-family:var(--f-display);font-stretch:118%;font-weight:700}
header .sp{flex:1}
.shell{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);min-height:calc(100vh - 62px)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tools{padding:14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line-2);background:transparent;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips b{font-family:var(--f-mono);font-weight:500;margin-left:4px}
.list{overflow:auto;flex:1}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:3px solid transparent;border-top:0;border-right:0}
.item:hover{background:var(--raised)}
.item[aria-current="true"]{background:var(--blue-soft);border-left-color:var(--blue)}
.item .id{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.item .car{font-weight:700}
.item .meta{font-size:12px;color:var(--muted);grid-column:1/-1}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
main{padding:22px;min-width:0}

.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-review{background:var(--warn-soft);color:var(--warn)}
.s-offer,.s-accepted{background:var(--ok-soft);color:var(--ok)}
.s-rejected,.s-declined{background:var(--bad-soft);color:var(--bad)}
.s-cancelled{background:var(--line);color:var(--muted)}
.grade{font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:5px;padding:1px 6px;margin-left:6px}
.g-A,.g-B{background:var(--ok-soft);color:var(--ok)} .g-C{background:var(--warn-soft);color:var(--warn)} .g-D{background:var(--bad-soft);color:var(--bad)}

.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.head h2{font-size:24px;margin-top:4px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel h3{font-size:15px;margin-bottom:12px}
.span2{grid-column:1/-1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;word-break:break-word}
.files{display:grid;gap:12px}
.files h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.files .row{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid var(--line-2);background:var(--raised);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn:hover{border-color:var(--blue)}
.form{align-items:end;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
fieldset{border:0;padding:0;margin:0 0 18px;min-width:0}
legend{font-family:var(--f-display);font-stretch:118%;font-weight:700;font-size:13px;margin-bottom:10px;padding:0}

.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:14px}
.ring{--p:0;--c:var(--muted);width:92px;height:92px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px}
.verdict{font-family:var(--f-display);font-stretch:115%;font-weight:700;font-size:17px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;position:relative;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.bar::after{content:"";position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:var(--lim)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.mini div{background:var(--raised);border-radius:10px;padding:10px 12px}
.mini b{display:block;font-family:var(--f-display);font-size:18px}
.mini small{color:var(--muted);font-size:11.5px}
ul.r{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
ul.r li.stop{color:var(--bad);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tl li{display:grid;grid-template-columns:auto 1fr;gap:10px}
.tl .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:6px}
.tl small{color:var(--muted);display:block}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
.back{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:relative;overflow:hidden}
.kpi b{display:block;font-family:var(--f-display);font-stretch:115%;font-weight:800;font-size:30px;line-height:1.1;margin-top:6px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.hot{border-color:var(--red)} .kpi.hot b{color:var(--red)}
.policy{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0;padding:0;list-style:none}
.policy li{background:var(--raised);border-radius:10px;padding:11px 13px;font-size:13px}
.policy b{display:block;font-family:var(--f-mono);font-weight:500;color:var(--blue)}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  aside{border-right:0}
  .shell.open aside{display:none}
  .shell:not(.open) main{display:none}
  .back{display:inline-flex}
  .grid{grid-template-columns:1fr}
  main{padding:16px}
}
</style>
</head>
<body>
<div class="login" id="login">
  <form id="loginForm">
    <span class="logoplate" style="justify-self:start"><img src="/logo.png" alt="Arzoom Avto"></span>
    <div><span class="eyebrow">Əməkdaş girişi</span><h2 style="margin-top:6px">Müraciətlərin qiymətləndirilməsi</h2></div>
    <label class="f">Adın və soyadın<input id="lName" autocomplete="name" required placeholder="Məs. Aysel Məmmədova"></label>
    <label class="f">Giriş açarı<input id="lToken" type="password" autocomplete="current-password" required></label>
    <div class="err" id="lErr"></div>
    <button class="btn" type="submit">Daxil ol</button>
    <p class="muted" style="margin:0;font-size:12.5px">Açar serverdəki .env faylında ADMIN_TOKEN kimi saxlanılır.</p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <span class="logoplate"><img src="/logo.png" alt="Arzoom Avto"></span>
    <span class="t">Qiymətləndirmə</span>
    <span class="sp"></span>
    <span class="muted" id="who"></span>
    <button class="btn ghost sm" id="logout" type="button">Çıxış</button>
  </header>
  <div class="shell" id="shell">
    <aside>
      <div class="tools">
        <input id="q" type="search" placeholder="Axtar: müraciət nömrəsi, FİN, telefon, model">
        <div class="chips" id="chips"></div>
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main id="detail"></main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/admin/scoring.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const grp=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ");
const azn=n=>grp(n)+" ₼";
const dt=s=>{const d=new Date(s);return d.toLocaleDateString("az-AZ",{day:"2-digit",month:"2-digit",year:"numeric"})+" "+d.toLocaleTimeString("az-AZ",{hour:"2-digit",minute:"2-digit"})};
const STATUS={review:"Baxılır",offer:"Təklif göndərilib",rejected:"Rədd edilib",accepted:"Satışa ötürülüb",declined:"Müştəri imtina etdi",cancelled:"Ləğv edilib"};
const INCOME={work:"Rəsmi iş yeri",biz:"Sahibkar",pension:"Pensiya",social:"Sosial yardım"};
const EVENTS={created:"Müraciət daxil oldu",assessed:"Qiymətləndirildi",offer:"Təklif göndərildi",rejected:"Müraciət rədd edildi",note:"Qeyd",
  accepted:"Müştəri son təklifi təsdiqlədi, satışa ötürüldü",declined:"Müştəri təklifdən imtina etdi",cancelled:"Müştəri müraciəti ləğv etdi",sms:"SMS"};
const FILTERS=[["","Hamısı"],["review","Baxılır"],["offer","Təklif"],["accepted","Satış"],["rejected","Rədd"],["declined","İmtina"],["cancelled","Ləğv"]];

let token="",staff="",status="review",query="",cur=null,items=[],counts={};
try{token=sessionStorage.getItem("az-admin-token")||"";staff=sessionStorage.getItem("az-admin-name")||""}catch(e){}

async function api(path,opts={}){
  const r=await fetch("/api/admin"+path,{...opts,headers:{"Content-Type":"application/json","x-admin-token":token,"x-staff-name":encodeURIComponent(staff),...(opts.headers||{})}});
  if(r.status===401){logout();throw new Error("Giriş açarı yanlışdır.")}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||"Xəta baş verdi.");
  return j;
}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function logout(){token="";try{sessionStorage.removeItem("az-admin-token")}catch(e){}$("#app").hidden=true;$("#login").hidden=false}

$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();token=$("#lToken").value.trim();staff=$("#lName").value.trim();
  try{await loadList();try{sessionStorage.setItem("az-admin-token",token);sessionStorage.setItem("az-admin-name",staff)}catch(e){}enter()}
  catch(err){$("#lErr").textContent=err.message;$("#login").hidden=false}
});
$("#logout").onclick=logout;
function enter(){$("#login").hidden=true;$("#app").hidden=false;$("#who").textContent=staff;if(!cur)renderHome()}

/* ---------- list ---------- */
async function loadList(){
  const j=await api(`/applications?status=${status}&q=${encodeURIComponent(query)}`);
  items=j.items;counts=j.counts;renderList();
}
function renderList(){
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  $("#chips").innerHTML=FILTERS.map(([k,t])=>`<button type="button" data-st="${k}" aria-pressed="${status===k}">${t}<b>${k?counts[k]||0:total}</b></button>`).join("");
  $("#list").innerHTML=items.length?items.map(a=>`<button type="button" class="item" data-id="${a.id}" aria-current="${cur&&cur.id===a.id}">
      <span class="car">${esc(a.brand)} ${esc(a.model)}</span><span class="st s-${a.status}">${STATUS[a.status]}</span>
      <span class="id">${a.id} · ${esc(a.fin)}</span><span class="id">${dt(a.created_at)}</span>
      <span class="meta">${a.income_sources.map(s=>INCOME[s]).join(", ")}${a.grade?`<span class="grade g-${a.grade}">Skor ${a.score} · ${a.grade}</span>`:""}</span></button>`).join(""):`<div class="empty">Bu filtrdə müraciət yoxdur.</div>`;
}
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-st]");if(!b)return;status=b.dataset.st;loadList().catch(err=>toast(err.message))});
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{query=e.target.value.trim();loadList().catch(err=>toast(err.message))},250)});
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)openApp(b.dataset.id)});

/* ---------- overview ---------- */
async function renderHome(){
  let k={};try{k=await api("/stats")}catch(e){}
  const rate=k.decided30?Math.round(k.approved30/k.decided30*100)+"%":"—";
  const P=Scoring.POLICY;
  $("#detail").innerHTML=`<span class="eyebrow">Ümumi vəziyyət</span><h2 style="margin-top:6px">Xoş gəldin, ${esc(staff)}</h2>
    <div class="kpis">
      <div class="kpi"><small>Bu gün daxil olub</small><b>${k.today??"—"}</b></div>
      <div class="kpi"><small>Baxılmağı gözləyir</small><b>${k.waiting??"—"}</b></div>
      <div class="kpi ${k.overdue?"hot":""}"><small>24 saatdan çox gözləyir</small><b>${k.overdue??"—"}</b></div>
      <div class="kpi"><small>Təsdiq faizi, 30 gün</small><b>${rate}</b></div>
      <div class="kpi"><small>Orta skor</small><b>${k.avg_score??"—"}</b></div>
      <div class="kpi"><small>Qəbul edilmiş təkliflər</small><b>${k.accepted??"—"}</b></div>
    </div>
    <section class="panel"><h3>Skorinq siyasəti</h3>
      <ul class="policy">
        <li><b>DTI ≤ ${P.maxDti*100}%</b>Bütün aylıq borclar xalis gəlirin yarısını keçmir; ${P.stopDti*100}%-dən yuxarı imtina tövsiyəsi</li>
        <li><b>Aktiv gecikmə</b>AKB-də cari gecikmə və ya 90+ gün keçmiş gecikmə dayandırıcı amildir</li>
        <li><b>Staj ≥ ${P.minTenureMonths} ay</b>6 aydan az −20, 12 aydan az −10 bal</li>
        <li><b>İlkin ödəniş ≥ ${P.minDownPct}%</b>Az olduqda −15, 30% və çox olduqda +5 bal</li>
        <li><b>A ≥ 80 · B ≥ 65 · C ≥ 50</b>A və B təsdiq, C əlavə baxış, D imtina</li>
        <li><b>Müştəri addımı</b>Təklifdən sonra müştəri ilkin ödənişi 70%-ə qədər artıra və son variantı təsdiqləyə bilər; təsdiqlənən müraciət "Satış" siyahısına düşür</li>
      </ul>
      <p class="muted" style="margin:12px 0 0;font-size:12.5px">Skor tövsiyədir, son qərarı kredit əməkdaşı verir. Qaydalar lib/scoring.js faylındadır.</p>
    </section>`;
}

/* ---------- detail ---------- */
async function openApp(id){
  try{cur=await api("/applications/"+encodeURIComponent(id))}catch(err){toast(err.message);return}
  $("#shell").classList.add("open");renderList();renderDetail();window.scrollTo({top:0});
}
const val=(a,k,d="")=>a.assessment?.inputs?.[k]??a.offer?.[k]??d;
function renderDetail(){
  const a=cur,open=["review","offer","rejected"].includes(a.status);
  const bySrc={};a.files.forEach(f=>(bySrc[f.income_source]??=[]).push(f));
  $("#detail").innerHTML=`
  <button type="button" class="btn ghost sm back" id="back" style="margin-bottom:12px">← Siyahı</button>
  <div class="head">
    <div><span class="eyebrow mono">${a.id}</span><h2>${esc(a.brand)} ${esc(a.model)}</h2><div class="muted">Daxil olub: ${dt(a.created_at)}${a.decided_by?` · Qərar: ${esc(a.decided_by)}`:""}</div></div>
    <span class="st s-${a.status}">${STATUS[a.status]}</span>
  </div>
  <div class="grid">
    <section class="panel"><h3>Müştəri</h3>
      <dl class="kv">
        <dt>FİN kod</dt><dd class="mono" lang="en">${esc(a.fin)}</dd>
        <dt>Şəxsiyyət vəsiqəsi</dt><dd class="mono">${esc(a.id_series)} ${esc(a.id_number)}</dd>
        <dt>Mobil</dt><dd><a href="tel:+${esc(a.phone)}" style="color:inherit">+${esc(a.phone)}</a></dd>
        <dt>Gəlir mənbəyi</dt><dd>${a.income_sources.map(s=>INCOME[s]).join(", ")}</dd>
        ${a.voen?`<dt>VÖEN</dt><dd class="mono">${esc(a.voen)}</dd>`:""}
        <dt>Razılıq</dt><dd>${dt(a.consent_at)} · IP ${esc(a.client_ip||"—")}</dd>
        ${a.reject_reason?`<dt>İmtina səbəbi</dt><dd>${esc(a.reject_reason)}</dd>`:""}
        ${a.offer?`<dt>Təklif</dt><dd>${azn(a.offer.price)}, ilkin ${a.offer.downPct}%, ${a.offer.months} ay, illik ${a.offer.rate}%</dd>`:""}
        ${a.offer?.final?`<dt>Son şərt (müştəri)</dt><dd style="color:var(--ok)">İlkin ödəniş ${a.offer.final.downPct}% · ${azn(a.offer.price*a.offer.final.downPct/100)} · aylıq ${azn(Scoring.pmt(a.offer.price*(1-a.offer.final.downPct/100),a.offer.rate,a.offer.months))}</dd>`:""}
      </dl>
    </section>
    <section class="panel"><h3>Gəlir sənədləri</h3>
      <div class="files">${a.income_sources.map(s=>`<div><h4>${INCOME[s]}</h4><div class="row">${(bySrc[s]||[]).map(f=>`<button type="button" class="fbtn" data-file="${esc(f.stored_name)}" title="${esc(f.original_name)}">${esc(f.original_name)}</button>`).join("")||`<span class="muted">Sənəd yüklənməyib</span>`}</div></div>`).join("")}</div>
    </section>

    <section class="panel span2"><h3>Qiymətləndirmə</h3>
      <div class="grid">
        <form id="aForm" autocomplete="off">
          <fieldset><legend>Kredit Bürosu (AKB) hesabatı</legend><div class="form">
            <label class="chk wide"><input type="checkbox" name="overdueNow" ${val(a,"overdueNow",false)?"checked":""}> Hazırda aktiv gecikmə var</label>
            <label class="f">Ən böyük keçmiş gecikmə<select name="maxOverdue">${["0","1-30","31-90","90+"].map(o=>`<option value="${o}" ${val(a,"maxOverdue","0")===o?"selected":""}>${o==="0"?"Gecikmə olmayıb":o+" gün"}</option>`).join("")}</select></label>
            <label class="f">Aktiv kreditlərin sayı<input name="activeLoans" type="number" min="0" value="${val(a,"activeLoans",0)}"></label>
            <label class="f">Mövcud aylıq ödənişlər, ₼<input name="debtMonthly" type="number" min="0" value="${val(a,"debtMonthly",0)}"></label>
            <label class="f wide">AKB üzrə qeyd<textarea name="akbNote" placeholder="Məs. 2 kredit kartı, limit 3 000 ₼">${esc(val(a,"akbNote"))}</textarea></label>
          </div></fieldset>
          <fieldset><legend>Gəlir</legend><div class="form">
            <label class="f">Təsdiqlənmiş xalis aylıq gəlir, ₼<input name="incomeMonthly" type="number" min="0" value="${val(a,"incomeMonthly","")}"></label>
            <label class="f">İş / fəaliyyət stajı, ay<input name="tenureMonths" type="number" min="0" value="${val(a,"tenureMonths","")}"></label>
            <label class="chk wide"><input type="checkbox" name="docsOk" ${val(a,"docsOk",false)?"checked":""}> Sənədlər yoxlanılıb və uyğundur</label>
          </div></fieldset>
          <fieldset><legend>Lizinq şərtləri</legend><div class="form">
            <label class="f">Avtomobilin qiyməti, ₼<input name="price" type="number" min="0" step="100" value="${val(a,"price","")}"></label>
            <label class="f">İlkin ödəniş, %<input name="downPct" type="number" min="0" max="90" value="${val(a,"downPct",20)}"></label>
            <label class="f">Müddət<select name="months">${[12,24,36,48,60].map(m=>`<option value="${m}" ${+val(a,"months",36)===m?"selected":""}>${m} ay</option>`).join("")}</select></label>
            <label class="f">İllik faiz, %<input name="rate" type="number" min="0" step="0.1" value="${val(a,"rate",17)}"></label>
            <label class="f">Komissiya, %<input name="commissionPct" type="number" min="0" step="0.1" value="${a.offer?.commissionPct??1.5}"></label>
          </div></fieldset>
          <button class="btn ghost" type="submit">Qiymətləndirməni saxla</button>
          ${a.assessment?`<span class="muted" style="margin-left:10px;font-size:12.5px">Son: ${esc(a.assessment.by)}, ${dt(a.assessment.at)}</span>`:""}
        </form>
        <div>
          <div id="result"></div>
          <div class="panel" style="background:var(--raised);margin-top:16px">
            <h3>Qərar</h3>
            <div class="actions" style="margin-top:0">
              <button class="btn" type="button" id="sendOffer" ${open?"":"disabled"}>Təklifi müştəriyə göndər</button>
            </div>
            <label class="f" style="margin-top:14px">İmtina səbəbi (müştəriyə göstərilmir)<textarea id="reason" placeholder="Məs. AKB-də aktiv gecikmə, borc yükü 64%"></textarea></label>
            <div class="actions"><button class="btn danger" type="button" id="reject" ${["review","offer"].includes(a.status)?"":"disabled"}>Müraciəti rədd et</button></div>
            ${open?"":`<p class="muted" style="margin:10px 0 0;font-size:12.5px">Müraciət bağlanıb, qərar dəyişdirilə bilməz.</p>`}
          </div>
        </div>
      </div>
    </section>

    <section class="panel span2"><h3>Tarixçə və qeydlər</h3>
      <ol class="tl">${a.events.map(evHtml).join("")||`<li class="muted">Hələ hadisə yoxdur.</li>`}</ol>
      <form id="nForm" style="display:flex;gap:8px;margin-top:16px"><input id="note" placeholder="Qeyd əlavə et, məs. müştəriyə zəng edildi"><button class="btn ghost" type="submit">Əlavə et</button></form>
    </section>
  </div>`;
  liveResult();
}
function evHtml(e){
  const d=e.details||{};
  const extra=e.kind==="assessed"?`${d.score} bal, ${d.grade} · ${Scoring.VERDICTS[d.verdict]||""}`:
    e.kind==="offer"?`${azn(d.price)}, ilkin ${d.downPct}%, ${d.months} ay, illik ${d.rate}%`:
    e.kind==="rejected"?d.reason:e.kind==="note"?d.text:e.kind==="sms"?(d.error?"Göndərilmədi: "+d.error:d.text):
    e.kind==="created"?`${d.files||0} sənəd`:e.kind==="accepted"&&d.downPct!=null?`ilkin ödəniş ${d.downPct}%`:"";
  return `<li><span class="dot" style="${e.kind==="rejected"||d.error?"background:var(--red)":""}"></span><span><b>${EVENTS[e.kind]||e.kind}</b>${extra?` · ${esc(extra)}`:""}<small>${dt(e.at)} · ${esc(e.actor)}</small></span></li>`;
}
function inputs(){
  const f=$("#aForm"),o={};
  [...f.elements].forEach(el=>{if(!el.name)return;o[el.name]=el.type==="checkbox"?el.checked:el.value});
  return o;
}
function liveResult(){
  const i=inputs(),r=Scoring.assess(i),lim=Scoring.POLICY.maxDti;
  const col=r.verdict==="approve"?"var(--ok)":r.verdict==="reject"?"var(--bad)":r.verdict==="incomplete"?"var(--muted)":"var(--warn)";
  const dtiW=r.dti==null?100:Math.min(100,r.dti*100);
  const dtiC=r.dti==null?"var(--line-2)":r.dti>Scoring.POLICY.stopDti?"var(--bad)":r.dti>lim?"var(--warn)":"var(--ok)";
  const comm=r.financed*(+i.commissionPct||0)/100;
  $("#result").innerHTML=`
    <div class="score"><div class="ring" style="--p:${r.verdict==="incomplete"?0:r.score};--c:${col}"><span>${r.verdict==="incomplete"?"—":r.score}</span></div>
      <div><span class="eyebrow">${r.verdict==="incomplete"?"İlkin hesablama":"Skor · "+r.grade}</span><div class="verdict" style="color:${col}">${Scoring.VERDICTS[r.verdict]}</div>
      <div class="muted" style="font-size:12.5px">${i.incomeMonthly?"":"Gəliri daxil et. "}${i.price?"":"Qiyməti daxil et."}</div></div></div>
    <div><div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="muted">Borc yükü (DTI)</span><b>${r.dti==null?"—":Math.round(r.dti*100)+"%"}</b></div>
      <div class="bar" style="--lim:${lim*100}%"><i style="width:${dtiW}%;background:${dtiC}"></i></div>
      <small class="muted">Hədd ${Math.round(lim*100)}%, imtina ${Math.round(Scoring.POLICY.stopDti*100)}%-dən yuxarı</small></div>
    <div class="mini">
      <div><small>Yeni aylıq ödəniş</small><b>${r.pay?azn(r.pay):"—"}</b></div>
      <div><small>Maliyyələşmə məbləği</small><b>${r.financed?azn(r.financed):"—"}</b></div>
      <div><small>Gəlirə görə maks. ödəniş</small><b>${azn(r.maxPayment)}</b></div>
      <div><small>Gəlirə görə maks. qiymət</small><b>${azn(r.maxPrice)}</b></div>
    </div>
    ${r.stops.length||r.notes.length?`<ul class="r">${r.stops.map(s=>`<li class="stop">${esc(s)}</li>`).join("")}${r.notes.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:`<p class="muted" style="margin:0">Risk faktoru yoxdur.</p>`}
    ${comm?`<p class="muted" style="font-size:12.5px;margin:10px 0 0">Komissiya: ${azn(comm)}</p>`:""}`;
}

document.addEventListener("input",e=>{if(e.target.closest("#aForm"))liveResult()});
document.addEventListener("change",e=>{if(e.target.closest("#aForm"))liveResult()});
document.addEventListener("submit",async e=>{
  if(e.target.id==="aForm"){e.preventDefault();
    try{await api(`/applications/${cur.id}/assessment`,{method:"PUT",body:JSON.stringify(inputs())});toast("Qiymətləndirmə saxlanıldı");await openApp(cur.id);loadList()}catch(err){toast(err.message)}}
  if(e.target.id==="nForm"){e.preventDefault();const t=$("#note").value.trim();if(!t)return;
    try{await api(`/applications/${cur.id}/notes`,{method:"POST",body:JSON.stringify({text:t})});await openApp(cur.id)}catch(err){toast(err.message)}}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.id==="back"){$("#shell").classList.remove("open");cur=null;renderList();renderHome()}
  if(b.dataset.file){
    try{const r=await fetch("/api/admin/files/"+encodeURIComponent(b.dataset.file),{headers:{"x-admin-token":token}});if(!r.ok)throw new Error("Fayl açılmadı.");
      const u=URL.createObjectURL(await r.blob());window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(err){toast(err.message)}}
  if(b.id==="sendOffer"){
    const i=inputs();if(!(+i.price>0)){toast("Avtomobilin qiymətini yaz.");return}
    const r=Scoring.assess(i);
    if(r.verdict==="reject"&&!confirmInline(b,"Skor imtina tövsiyə edir. Yenə göndər?"))return;
    try{
      await api(`/applications/${cur.id}/assessment`,{method:"PUT",body:JSON.stringify(i)});
      await api(`/applications/${cur.id}/offer`,{method:"POST",body:JSON.stringify({price:+i.price,downPct:+i.downPct,months:+i.months,rate:+i.rate,commissionPct:+i.commissionPct})});
      toast("Təklif müştəriyə göndərildi");await openApp(cur.id);loadList()}catch(err){toast(err.message)}}
  if(b.id==="reject"){
    const reason=$("#reason").value.trim();if(!reason){toast("İmtina səbəbini yaz.");$("#reason").focus();return}
    if(!confirmInline(b,"Rədd etməyi təsdiqlə"))return;
    try{await api(`/applications/${cur.id}/reject`,{method:"POST",body:JSON.stringify({reason})});toast("Müraciət rədd edildi");await openApp(cur.id);loadList()}catch(err){toast(err.message)}}
});
// Two-step confirm on the button itself, so no browser dialogs are needed.
function confirmInline(b,text){
  if(b.dataset.armed){delete b.dataset.armed;return true}
  b.dataset.armed="1";b.dataset.label=b.textContent;b.textContent=text;
  setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.label}},4000);
  return false;
}

if(token){$("#lName").value=staff;loadList().then(enter).catch(()=>{})}
setInterval(()=>{if(token&&!$("#app").hidden)loadList().catch(()=>{})},60000);
</script>
</body>
</html>
